spring:
  application:
    name: springboot
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5431/gsadmin}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:1234}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 60000
      connection-timeout: 30000
      initialization-fail-timeout: 0
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        boot:
          allow_jdbc_metadata_access: false
    show-sql: false
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:}
            client-secret: ${GITHUB_CLIENT_SECRET:}
            scope: user:email,read:user
            redirect-uri: "${OAUTH_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}"
          #google:
            #client-id: GOOGLE_CLIENT_ID
            #client-secret: GOOGLE_CLIENT_SECRET

server:
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        secure: true
        same-site: lax

logging:
  level:
    root: INFO
    com.back.app: INFO

stripe:
  api:
    key: ${STRIPE_API_KEY:}
  connect:
    platform_fee_percent: 10  # Platform fee percentage (10% default)

app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:5173}
  backend:
    url: ${APP_BACKEND_URL:http://localhost:8080}
